name: CI

on:
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Syntax check
        run: python3 -m py_compile sdr.py

      - name: Smoke test
        run: |
          python3 sdr.py example.txt -o /tmp/test_report
          test -f /tmp/test_report.html
          test -f /tmp/test_report_redacted.html
          test -f /tmp/test_report.csv

      - name: Smoke test with potfile
        run: |
          python3 sdr.py example.txt -p example.potfile -o /tmp/test_report_pot
          test -f /tmp/test_report_pot.html
          test -f /tmp/test_report_pot.csv
