[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "secretsdump-reporter"
version = "1.3.0"
description = "Parse secretsdump output and generate HTML reports and CSV with password reuse analysis"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "yepskotch" }]
keywords = ["secretsdump", "ntds", "active-directory", "password", "pentest", "security"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
]

[project.urls]
Homepage = "https://github.com/yepskotch/SecretsDumpReporter"
Repository = "https://github.com/yepskotch/SecretsDumpReporter"
"Bug Tracker" = "https://github.com/yepskotch/SecretsDumpReporter/issues"

[project.scripts]
secretsdump-reporter = "sdr:main"

[tool.setuptools]
py-modules = ["sdr"]
