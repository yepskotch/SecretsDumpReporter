[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "secretsdump-reporter"
version = "1.0.7"
description = "Parse secretsdump output and generate HTML reports and CSV with password reuse analysis"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

[project.scripts]
secretsdump-reporter = "sdr:main"

[tool.setuptools]
py-modules = ["sdr"]
